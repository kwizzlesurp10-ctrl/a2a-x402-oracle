name: ci
on:
  pull_request:
  push:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run lint
